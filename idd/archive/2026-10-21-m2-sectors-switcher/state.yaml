      "answer": "Formato: selector compacto, igual en móvil y escritorio, sin pin. Contenido: problema + tres cosas que construimos, copy propuesto por el agente en es/en y revisado en el PR. Fragmentos vivos como una app real. Pausa: una vuelta por entrada en pantalla y luego quieto, pausa con puntero o foco encima, parada al elegir una pestaña, sin botón. Móvil: pestañas en rejilla 2×2. Ritmo: 6 s por sector, cambios de estado de los fragmentos cada ~1,5 s. URL sin estado, empieza en Logística; sin JS, acordeón exclusivo con todo el texto.",
