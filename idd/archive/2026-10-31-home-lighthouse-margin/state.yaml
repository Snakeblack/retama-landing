      "reason": "Todo el texto sigue en el HTML y la capa de movimiento solo pone estados de partida que anima; el JS de arranque de la portada baja de ~52 KB a ~7 KB gzip y GSAP pasa a un import() diferido, que el ADR deja fuera del presupuesto"
