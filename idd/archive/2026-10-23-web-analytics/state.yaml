        "question": "¿Snippet manual con el token del sitio en PUBLIC_CF_ANALYTICS_TOKEN (Workers Builds) o configuración automática del borde? Sin token, ¿ni beacon ni CSP ampliada, como PUBLIC_BOOKING? Y el límite de 60 KB gzip del ADR 0001: el beacon pesa 10,0 KB y la portada ya carga 49,7 KB; ¿se carga tras el evento load (no cuenta) o al inicio (59,7 KB)?"
      },
      {
        "category": "uniqueness",
        "question": "¿Lo cargan todas las páginas de Base.astro (portada, blog, legales y 404)? ¿Las Previews lo cargan con el mismo token (Cloudflare descarta los hostnames que no son retama.dev) o solo la rama main (WORKERS_CI_BRANCH)?"
      },
      {
        "category": "persistence",
        "question": "¿El test del ADR 0007 admite solo static.cloudflareinsights.com y cloudflareinsights.com (beacon como doble en su URL real, CI con un token de prueba) y comprueba además que no queda nada en localStorage ni sessionStorage?"
      },
      {
        "category": "copy",
        "question": "¿Se actualiza la política de privacidad (entrada, quién trata los datos y base legal) y la fecha «Actualizado el» para contar la medición de Cloudflare?"
