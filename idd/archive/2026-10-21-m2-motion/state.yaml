  "impacts": [
    {
      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "Ninguna palabra depende de JS: el estado oculto de las entradas lo pone el propio script y el shutter es CSS; fija el presupuesto de JS por página que el ADR anunciaba para la primera isla de M2 y su línea - Check: sustituye a la frase que lo anunciaba, sin tocar la decisión"
    },
    {
      "kind": "adr",
      "id": "0004",
      "impact": "conforms",
      "reason": "El póster sigue siendo el primer pintado y el elemento estático; el shutter solo recorta y escala su ficha con CSS, y con reduced-motion no hay shutter; la escena 3D no se toca (m2-hero-3d)"
    },
    {
      "kind": "adr",
      "id": "0005",
      "impact": "conforms",
      "reason": "Los tokens de movimiento salen de la tabla Motion de DESIGN.md y se generan en theme.css con pnpm design:theme; el JS los lee del CSS en lugar de duplicarlos"
    },
    {
      "kind": "adr",
      "id": "0006",
      "impact": "conforms",
      "reason": "Los scripts se empaquetan como módulos propios con hash de Astro; el movimiento cambia variables y estilos por CSSOM (GSAP), que la CSP sin unsafe-inline permite; sin manejadores inline ni router de cliente"
    },
    {
      "kind": "scenario",
      "id": "brand-impact",
      "impact": "conforms",
      "reason": "Añade el movimiento del presupuesto de DESIGN.md (shutter, entradas, pin, lupa); con reduced-motion la experiencia queda completa solo con fundidos"
    },
    {
      "kind": "scenario",
      "id": "perf-mobile",
      "impact": "conforms",
      "reason": "Sin entradas en el primer pantallazo para no mover el LCP; presupuesto de JS de 60 KB gzip comprobado en CI; solo transform, opacity y clip-path; Lighthouse 100 x4 sigue como puerta"
    }
  ],
