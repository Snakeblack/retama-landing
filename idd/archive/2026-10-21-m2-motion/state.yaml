      "id": "open-facts",
      "status": "resolved",
      "answer": "todas las recomendadas: (1) scroll nativo, sin Lenis; (2) Sectores se fija solo desde lg (1024px) unas 2,5 pantallas y recorre los 4 sectores (activo en tinta plena con el cuadrado naranja, el resto atenuado), scrub sin snap; por debajo de lg y con reduced-motion no se fija; (3) presupuesto de JS al inicio <= 60 KB gzip por página, el 3D diferido tendrá el suyo en m2-hero-3d; (4) monoespaciada del sistema (ui-monospace); (5) design:theme genera la tabla Motion de DESIGN.md en theme.css y GSAP la lee de CSS. Además: shutter en CSS puro, sin entradas en el primer pantallazo, solo la cifra 100 cuenta",
      "source": "user"
    }
