  "impacts": [
    {
      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "La acción de reservar es un enlace a Cal.com en el HTML; la isla booking.ts solo lo mejora con el iframe. La casilla y sus textos están en el HTML, ocultos hasta el clic."
    },
    {
      "kind": "adr",
      "id": "0005",
      "impact": "conforms",
      "reason": "La altura del calendario sale de dos tokens nuevos de DESIGN.md (calendar, calendar-sm) con el tema regenerado; design:lint limpio."
    },
    {
      "kind": "adr",
      "id": "0006",
      "impact": "conforms",
      "reason": "Cal.com entra en la allowlist documentada solo como frame-src https://cal.com y solo con PUBLIC_BOOKING=true (Home.astro con Astro.csp.insertDirective); sin script de terceros nuevo, sin unsafe-inline; E2E sin violaciones al abrirlo."
    },
    {
      "kind": "adr",
      "id": "0007",
      "impact": "conforms",
      "reason": "El calendario solo se carga tras el clic del visitante; comprobado con Playwright: solo deja la cookie de seguridad __cf_bm de Cloudflare, ningún tracker con cookies. Sin clic, cero peticiones a cal.com (E2E)."
    },
    {
      "kind": "adr",
      "id": "0008",
      "impact": "conforms",
      "reason": "Las cinco claves booking.* están en es.ts y en.ts; E2E en / y /en/."
    }
