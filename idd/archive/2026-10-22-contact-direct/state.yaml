{
  "schema": "idd-state/v1",
  "change": "contact-direct",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "feature",
    "summary": "Reserva de llamada en Hablemos: el calendario de Cal.com se carga solo al pedirlo (clic), con enlace directo como alternativa; mailto y WhatsApp ya están",
    "acceptance": "En / y /en/ el capítulo Hablemos ofrece reservar una llamada; sin pulsar no hay ninguna petición a cal.com; al pulsar se carga el calendario de Cal.com en la página y queda visible un enlace directo a la página de reserva; sin JS el enlace lleva a Cal.com; la CSP del build solo añade cal.com a frame-src; tests unitarios y E2E con Cal.com simulado"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿cómo se integra Cal.com: iframe en la página tras el clic (lo que dicen functional-scope y la base técnica) o solo un enlace que abre Cal.com en otra pestaña?"
      },
      {
        "category": "uniqueness",
        "question": "¿se carga una sola vez por visita (cerrar y reabrir reutiliza el iframe) o se recarga cada vez?"
      },
      {
        "category": "persistence",
        "question": "sin cuenta de Cal.com, ¿URL provisional marcada PROVISIONAL en src/lib/board.ts (como el WhatsApp) u ocultar la reserva hasta tener cuenta?"
      },
      {
        "category": "copy",
        "question": "¿dónde va la acción de reservar y cómo se abre el calendario (en línea en el capítulo o en un diálogo)? Se decide con maquetas"
      },
      {
        "category": "url-state",
        "question": "¿abrir el calendario cambia la URL (hash) o no deja rastro, como el formulario?"
      },
      {
        "category": "accessibility",
        "question": "¿el foco pasa al calendario al abrirlo y hay forma de cerrarlo y volver a la acción?"
      },
      {
        "category": "errors",
        "question": "¿qué se ve si el iframe no carga o tarda (enlace directo siempre visible, aviso tras un tiempo)?"
      }
    ]
  },
