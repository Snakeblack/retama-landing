  "intent": {
    "kind": "bug",
    "summary": "La máscara EMAIL de src/lib/report.ts solo reconoce ASCII: josé@empresa.es y ana@münchen.de llegan al log sin enmascarar y muñoz@gmail.com queda como muñ[email] (F-57c62da5)",
    "acceptance": "clip() enmascara entera una dirección con letras no ASCII en la parte local o en el dominio (josé@empresa.es, muñoz@gmail.com, ana@münchen.de) sin dejar nada de la parte local; los marcos de Firefox (fn@/path:1:2) siguen sin enmascararse; el test de tiempo adversario sigue pasando"
  },
  "facts": {
    "open": [
      "¿Qué caracteres admite la parte local y el dominio: letras, dígitos y marcas de cualquier escritura más ._%+- en la parte local y - en el dominio, o también el resto de símbolos que permite el RFC 5322 (!#$&'*/=?^`{|}~)?",
      "¿Se enmascara también un dominio no ASCII codificado con porcentajes, como el que deja URL.pathname en la ruta de la página o del archivo (ana@m%C3%BCnchen.de)?",
      "¿Se enmascaran arrobas alternativas como la de ancho completo (＠, U+FF20) o quedan fuera?"
    ]
  },
