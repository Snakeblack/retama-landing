{
  "schema": "idd-state/v1",
  "change": "observability",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "feature",
    "summary": "Workers Logs y Traces activados en wrangler.jsonc, y /api/contact/ vigilable por un uptime externo gratuito (UptimeRobot) junto con / y /en/",
    "acceptance": "El Worker desplegado tiene observability activa (logs y traces) y los fallos del contacto salen con severidad de error; UptimeRobot recibe 2xx en /, /en/ y en una comprobación GET de /api/contact/ que no llama a terceros ni revela datos; la línea base y el roadmap nombran UptimeRobot"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "UptimeRobot gratis solo hace GET/HEAD y da por caído todo lo que no sea 2xx/3xx, y hoy GET /api/contact/ responde 404 (src/pages/api/contact.ts:24 solo exporta POST): ¿se añade un GET de salud, qué comprueba y qué responde, o no se vigila la API?"
      },
      {
        "category": "uniqueness",
        "question": "¿la comprobación de salud cuenta contra el límite de envíos CONTACT_LIMITER o queda fuera?"
      },
      {
        "category": "persistence",
        "question": "¿se activan también las Traces y con qué muestreo, sabiendo que el plan gratis da 200.000 eventos al día y 3 días de retención y que el precio cambia el 01-12-2026?"
      },
      {
        "category": "copy",
        "question": "¿a quién avisa UptimeRobot (correo de la cuenta) y se publica su página de estado gratuita?"
      },
      {
        "category": "url-state",
        "question": "¿el GET de salud vive en la misma ruta /api/contact/ (sin ruta nueva, ADR 0002) o en otra?"
      },
      {
        "category": "accessibility",
        "question": "no hay interfaz nueva; ¿se confirma que el cambio no toca páginas visibles?"
      },
      {
        "category": "errors",
        "question": "¿qué desenlaces del contacto deben salir con severidad de error (console.error) en Workers Logs? Hoy todo va por console.log (src/server/contact.ts:66)"
      }
    ]
  },
