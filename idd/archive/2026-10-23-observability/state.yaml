      "status": "resolved",
      "answer": "GET de salud con config en la misma ruta /api/contact/: 200 {ok:true} con los 5 secretos y el binding, 503 unavailable si falta alguno, sin llamar a terceros ni gastar CONTACT_LIMITER; sin interfaz nueva. Severidad error solo para unavailable y delivery. Traces al 100% (logs al 100%). UptimeRobot avisa por email de la cuenta, sin status page.",
