  "impacts": [
    {
      "kind": "adr",
      "id": "0002",
      "impact": "conforms",
      "reason": "El GET de salud vive en la misma y única ruta bajo demanda /api/contact; no se añade ninguna ruta y on-demand-routes sigue pasando. observability es configuración de la plataforma, no un desplegable nuevo."
    },
    {
      "kind": "adr",
      "id": "0003",
      "impact": "conforms",
      "reason": "Workers Logs guarda eventos efímeros de la plataforma (3 días), no un almacén del sistema; no se añade ningún binding persistente y los registros siguen sin datos personales (tests de registros). El GET de salud no lee ni guarda nada."
    }
