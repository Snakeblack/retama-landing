  "intent": {
    "kind": "refactor",
    "summary": "The e2e job installs Chromium with --with-deps, which downloads its system packages with apt from azure.archive.ubuntu.com; on 2026-10-26 that took 7 min 50 s for 25.9 MB in PR #83 and once ran a job of main into its 15-minute timeout, while the browser itself downloads in about 7 s",
    "acceptance": "The e2e job installs only Playwright's Chromium, without apt packages; the same e2e suite passes in CI and the install step takes seconds"
  },
  "facts": {
    "basis": "The user chose option 1 on 2026-10-26 («1. si»): drop --with-deps. The ubuntu-latest runner ships Google Chrome, which the lighthouse job already uses, and no e2e test compares screenshots, so the fonts --with-deps adds do not matter; a missing library would fail the launch at once and name it"
  },
