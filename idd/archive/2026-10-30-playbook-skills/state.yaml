                "summary": "The agent-setup guard and the idd security_boundary cover only .claude/settings.json and .claude/skills/**. Files such as .mcp.json, .claude/commands/**, .claude/agents/** and .claude/hooks/** also load in every session of a clone of this public repo, and they trigger no test failure and no boundary signal (scripts/lib/agent-setup.mjs:18-63, idd/config.yaml:34-41). Impact is conditional on such a file being merged.",
