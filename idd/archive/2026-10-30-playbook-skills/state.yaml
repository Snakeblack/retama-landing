          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "The new fitness test (tests/unit/agent-setup.test.ts:15-28) and the removal of scripts/lib/skills.mjs:69-88 and skills-scan.mjs drop controls that applied to every folder in .claude/skills, including the kept blog-writing, in this public repo. Gone: hook definitions, invisible/Unicode-tag characters, symlinks, pipe-to-shell, remote-instructions and home-dotfile writes. The test now only denies extraListKnownMarketplaces and LICENSE/NOTICE, and never inspects the other keys of .claude/settings.json (hooks, env, apiKeyHelper, statusLine, permissions). A PR could add a hook to settings.json or a hidden instruction, symlink or script to a skill folder and CI would pass. ADR 0013 also lost 0010's 'no skills with hooks' rule. Existing control: both paths are in idd/config.yaml security_boundary, so it is a human-review gap, not an open exploit.",
                "acceptance_criteria": "An automated check (CI-run) fails if: .claude/settings.json has any top-level key other than enabledPlugins, or any enabledPlugins entry other than retama@retama and retama-motion@retama; a symlink or non-text/executable file exists under .claude/skills; or a file there contains invisible Unicode (U+200B-200F, 202A-202E, 2060-2064, FEFF, E0000-E007F) or a hooks definition. Demonstrated by tests that fail on each case. ADR 0013 states the rule it enforces."
              },
              {
                "severity": "SUGGESTION",
                "summary": "ADR 0013 (docs/architecture/decisions/0013-agent-skills-from-the-playbook.md:16,27-28) moves trust for third-party skills and their session-start hook to a private marketplace whose pinning and audit cannot be checked from this repo, and its Review trigger drops 0010's 'a skill appears compromised' trigger (0010:28). enabledPlugins cannot pin a version, so what each machine loads depends on the playbook's state.",
                "acceptance_criteria": "ADR 0013's Review trigger includes a compromised or unaudited playbook skill or plugin update, and the Consequences or Decision names who updates and audits the playbook plugins (or that the playbook pins their versions) before landing contributors use them."
              }
            ]
          },
          "operation": null,
          "result_request_id": "playbook-skills:lens-result:1:1"
