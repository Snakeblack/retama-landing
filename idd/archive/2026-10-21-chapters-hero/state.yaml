  "impacts": [
    {
      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "Todo el texto sigue en el HTML (título, manifiesto, copy); la escena y el scrub del manifiesto son mejoras: sin JS el título es letras y el manifiesto está en tinta plena. La escena es un import diferido en worker, fuera del presupuesto de JS de inicio"
    },
    {
      "kind": "adr",
      "id": "0004",
      "impact": "conforms",
      "reason": "El LCP sigue siendo el título HTML; la escena de glifos se carga tras load, en worker, solo si es visible, con WebGPU→WebGL2→póster, se rinde por debajo de 30 fps, se queda en póster con movimiento reducido o ahorro de datos y se pausa fuera de pantalla, con la pestaña oculta y con el botón de pausa (WCAG 2.2.2). Lighthouse 100×4 en / y /en/"
    },
    {
      "kind": "adr",
      "id": "0005",
      "impact": "conforms",
      "reason": "DESIGN.md sigue siendo la única fuente: cambia display-sm (104→72 px) y se describen capítulos, escena de glifos y las excepciones aprobadas por el usuario (bloom solo en la escena, «a medida» en primario, bajada fija); theme.css regenerado con pnpm design:theme y design:lint limpio"
    },
    {
      "kind": "adr",
      "id": "0006",
      "impact": "conforms",
      "reason": "Sin style ni manejadores inline: la escena usa CSSOM y custom properties, el botón de pausa es un SVG con atributos de presentación; el e2e de la escena WebGL2 comprueba cero violaciones de CSP"
    },
    {
      "kind": "adr",
      "id": "0008",
      "impact": "conforms",
      "reason": "Claves nuevas (hero.word, hero.rest, hero.lead, nav.talk, manifesto.line1/2) y retiradas (hero.title, hero.fact1-5, method.field/fieldNote) iguales en es y en; el test de paridad de i18n pasa y las anclas siguen traducidas"
    }
  ],
