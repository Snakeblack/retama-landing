  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Two moderate Dependabot alerts stay open on development dependencies with a patch: fflate 0.7.3 (GHSA-px8p-9vwx-vf98, fixed in 0.7.5), pinned exactly by satori even in its latest release, and uuid 8.3.2 (GHSA-w5hq-g745-h8pq, fixed in 11.1.1), required by @lhci/cli 0.15.1, its latest release",
    "acceptance": "pnpm overrides resolve fflate 0.7 to ^0.7.5 and uuid 8 to ^11.1.1; pnpm audit --audit-level moderate reports only the 3 ignored highs; a unit test keeps those versions out of the lockfile; the build still renders the OG images with satori and Lighthouse CI still collects; Dependabot alerts #1 and #3 close after the merge"
  },
  "facts": {
    "basis": "pnpm-workspace.yaml already overrides the vulnerable transitive versions that @lhci/cli pins and keeps auditConfig.ignoreGhsas for advisories without a patched release; the hand-off of 2026-10-26 asks for an override when it fits. fflate 0.7.5 is a patch release; @lhci/cli only calls require('uuid').v4() (src/collect/node-runner.js:11 and 65), which uuid 11 keeps in its CommonJS build"
  },
  "plan": {
    "paths": [
      "pnpm-lock.yaml",
      "pnpm-workspace.yaml",
      "tests/unit/dependency-alerts.test.ts"
    ],
    "work_units": 1,
    "decision": false,
    "operations": []
  },
