    "request": "M3 2/3 contact-form: formulario en Hablemos (Turnstile cargado al interactuar, CSP con challenges.cloudflare.com, estados de éxito y error, i18n es/en), con maquetas primero",
    "kind": "feature",
    "summary": "Formulario de contacto en el capítulo Hablemos (es/en) que envía a /api/contact con Turnstile cargado al interactuar, validación en cliente y estados de envío, éxito y error",
    "acceptance": "En / y /en/ el capítulo Hablemos muestra el formulario (nombre, correo, tipo de proyecto, mensaje) en el HTML; al enviarlo con datos válidos llama a /api/contact/ con el token de Turnstile y muestra el éxito; ante un 4xx/5xx muestra un error que conserva lo escrito y ofrece correo y WhatsApp; la CSP del build admite challenges.cloudflare.com y nada más nuevo; tests unitarios y E2E con la API simulada"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Cómo se compone el capítulo (maquetas A/B), cómo se elige el tipo de proyecto (casillas o desplegable) y qué ve un visitante sin JavaScript, si el envío exige el token de Turnstile?"
      },
      {
        "category": "uniqueness",
        "question": "¿Tras un envío correcto se sustituye el formulario por la confirmación o se vacía para otro envío, y cómo se evita el doble envío?"
      },
      {
        "category": "persistence",
        "question": "¿Se guarda el borrador del mensaje en el navegador al recargar, o nada (ADR 0003, estado efímero)?"
      },
      {
        "category": "copy",
        "question": "¿El enlace de correo del error lleva precargado lo escrito, qué número de WhatsApp provisional se usa y qué texto de privacidad acompaña al botón hasta la página legal de M4?"
      },
      {
        "category": "url-state",
        "question": "¿El formulario lee algo de la URL (preseleccionar el tipo desde Servicios) o ninguno?"
      },
      {
        "category": "accessibility",
        "question": "¿Turnstile se muestra siempre o solo cuando Cloudflare necesita una interacción (appearance interaction-only)?"
      },
      {
        "category": "errors",
        "question": "¿Cuándo aparecen los errores de cada campo y qué mensaje distinto se da por 400, 403 de verificación, 429, 502 y 503?"
      }
    ]
  },
