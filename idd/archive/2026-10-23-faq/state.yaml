  "gates": [
    {
      "id": "open-facts",
      "status": "resolved",
      "answer": "1. Plazos: diferenciar el tipo de web (landing page o aplicación web), su tamaño y complejidad; entregas cada una o dos semanas según alcance y complejidad. 2. Garantía de 6 meses, siempre que esté justificada. 3. Al pagar el código pasa a ser del cliente, siempre. 4. Remoto: con o sin vídeo; hacer hincapié en que hay un sistema de seguimiento dedicado para el cliente. 5. Presupuesto a medida: por fases con un primer MVP y escalar de forma ágil, o presupuesto cerrado con entrega final de lo propuesto. 6. Mantenimiento mensual de pago opcional, y también bajo petición, con coste algo más elevado según su complejidad. FAQPage en JSON-LD y llms.txt: sí. Forma: acordeón nativo <details> (opción A). Ancla preguntas/questions, en el menú de cabecera y en el índice de capítulos.",
      "source": "user"
    }
  ],
