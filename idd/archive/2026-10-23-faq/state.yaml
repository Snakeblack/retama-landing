      "id": "0001",
      "impact": "conforms",
      "reason": "El capítulo es HTML estático: las preguntas son <details> nativos con la primera abierta, legibles y operables sin JavaScript (questions.spec.ts sin JS)."
    },
    {
      "kind": "adr",
