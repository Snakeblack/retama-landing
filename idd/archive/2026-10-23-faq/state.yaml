      "impact": "conforms",
      "reason": "Colores, tipos y espaciados salen de los tokens de DESIGN.md (bg-surface-raised, type-statement, p-tile, ps-lg); DESIGN.md describe el capítulo y pnpm design:lint lo valida."
    },
    {
      "kind": "adr",
      "id": "0008",
      "impact": "conforms",
      "reason": "Textos y anclas en es.ts y en.ts con las mismas claves (preguntas/questions); el JSON-LD y llms.txt toman el texto del idioma de cada página."
    },
    {
      "kind": "scenario",
      "id": "brand-impact",
      "impact": "conforms",
      "reason": "Un capítulo de una idea con poco texto, tiles planas y el cuadrado primario como marca; con movimiento reducido no pierde nada porque no anima."
    },
    {
      "kind": "scenario",
      "id": "perf-mobile",
      "impact": "conforms",
      "reason": "Solo añade HTML estático y CSS de utilidades, sin JS ni imágenes; no toca el LCP (título del hero) y los details cerrados no desplazan contenido al cargar."
    },
    {
      "kind": "scenario",
      "id": "seo-discovery",
      "impact": "conforms",
      "reason": "Añade un FAQPage al grafo JSON-LD de la portada con el texto literal del capítulo y las preguntas a llms.txt; el HTML sigue completo sin JS."
    }
  ],
