      "answer": "todos los recomendados (one /legal/ page in es and en with three sections and translated anchors, indexable and in the sitemap; PUBLIC_LEGAL_NAME and PUBLIC_LEGAL_TOWN required, PUBLIC_LEGAL_NIF and PUBLIC_LEGAL_ADDRESS optional, each line only when set; the Workers Builds build (WORKERS_CI=1) fails without name or town, local and GitHub builds go without and E2E uses test data; messages kept for the inquiry and at most 12 months without an engagement; CONTACT_BACKUP is Gmail (Google); basis art. 6.1.b for replies and 6.1.f for antispam and rate limit; Retama is the owner's trade name; Spanish prevails; the form line becomes the AEPD first layer with a link; links in the footer of every page, the 404 pages get the footer; the owner record lives in src/lib/board.ts)",
