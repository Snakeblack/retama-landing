{
  "schema": "idd-state/v1",
  "change": "legal-pages",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "Legal primero: aviso legal, privacidad y cookies con el titular por variables de build",
    "kind": "feature",
    "summary": "Legal notice, privacy policy and cookie policy pages in es and en (LSSI/RGPD), with the owner's identifying data taken from the build environment so it stays out of the public repository, linked from the footer and from the contact form",
    "acceptance": "Both locales serve the three legal pages with reciprocal hreflang and no JS needed; the legal notice shows the owner data set in the build environment and nothing invented when it is unset; the privacy policy names the controller, purposes, legal basis, recipients (Cloudflare, Resend, Google, Cal.com), retention and rights; the cookie policy lists the cookies observed in a real visit; every page footer and the contact form link to them"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "Which owner data does the legal notice show and where does it come from: name and town from build variables now, and NIF and full address when they exist?"
      },
      {
        "category": "uniqueness",
        "question": "Does the owner record live in one module beside the contact channels (src/lib/board.ts:1) so a later company swaps one place?"
      },
      {
        "category": "persistence",
        "question": "How long are contact messages kept in the inbox, and which provider holds the CONTACT_BACKUP mailbox?"
      },
      {
        "category": "copy",
        "question": "Which legal basis does the privacy policy state, is Retama presented as the owner's trade name, does the Spanish text prevail over the English one, and does the line under the form (src/i18n/es.ts:176) become the AEPD first layer with a link to the policy?"
      },
      {
        "category": "url-state",
        "question": "Which routes do the legal pages take, given that ADR 0008 alternates assume one path per page in every locale (src/lib/seo.ts:14): one /legal/ page with three sections or three pages, with which slugs, and are they indexable and in the sitemap or noindex?"
      },
      {
        "category": "accessibility",
        "question": "Where do the links live: in the footer of every page (src/components/board/Footer.astro:13), and also on the 404 pages that have no footer?"
      },
      {
        "category": "errors",
        "question": "What happens when the owner variables are missing: fail the Workers Builds build (WORKERS_CI=1), or publish the pages without them?"
      }
    ]
  },
