          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "src/lib/report.ts:44-52,71,74 run backtracking regexes (EMAIL, the Firefox frame test, FRAME_URL) over attacker-controlled text of up to 8 KB before truncating it to MAX_TEXT. Input such as 8000 repeated characters without '@' makes them quadratic, so one 8 KB POST to /api/report/ can cost far more CPU than an ordinary report. Trigger: a POST with a very long message or stack line. Impact: CPU exhaustion of that request on a CPU-limited plan.",
                "acceptance_criteria": "A unit test with 8 KB adversarial inputs (a long run of word characters without '@', many '@', a long 'at ' line with no '://') passes through errorReport/clip within a small fixed time bound, showing near-linear cost. Emails are still fully masked and never partly leaked by truncation: the existing masking tests still pass."
              },
              {
                "severity": "SUGGESTION",
                "summary": "The normalization in src/lib/report.ts does not strip the query or fragment of URLs that appear inside `message`. It also does not clip or mask the `page`, `file` and `blocked` values that come from sitePath and url.origin. This is a conditional gap against ADR 0011:27 and the no-personal-data claim, not a proven exposure.",
                "acceptance_criteria": "Unit tests show that a message containing a URL with ?query or #fragment is logged without them. They also show that page, file and blocked values are bounded in length, and that an email-like path segment is masked or dropped. Alternatively, the ADR states the reduced guarantee explicitly. The existing report tests still pass."
              }
            ]
          },
