{
  "schema": "idd-state/v1",
  "change": "client-errors",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "continua",
    "kind": "feature",
    "summary": "Errores de cliente: endpoint /api/report/ que registra en Workers Logs los errores de JavaScript de las páginas y los informes de violación de la CSP, sin datos personales (M6, 4.ª pieza; ADR nuevo que amplía el 0002)",
    "acceptance": "Un error de JavaScript no capturado o una violación de la CSP en cualquier página del build produce una línea JSON sin datos personales en Workers Logs vía /api/report/; los informes inválidos, ajenos o por encima del límite se descartan; el fitness de rutas bajo demanda admite exactamente /api/contact y /api/report con un ADR que lo justifica"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "\"¿Qué recoge /api/report/? Propuesta: (a) errores de JS (eventos error y unhandledrejection) que un script pequeño envía con sendBeacon desde todas las páginas, también en las Previews; (b) informes de la CSP que manda el propio navegador, con report-to + Reporting-Endpoints (Chromium) y report-uri (Firefox y Safari). Cuerpo de 8 KB como máximo; de cada informe solo el tipo, el mensaje (300 caracteres como máximo), el archivo si es de la web, la línea, la columna y la primera línea de la pila; de la CSP, la directiva y el origen bloqueado. Ni user agent ni IP.\""
      },
      {
        "category": "uniqueness",
        "question": "\"¿Cómo se frena el ruido? Propuesta: el script manda como mucho 5 informes por carga de página y cada mensaje idéntico una sola vez; descarta «Script error.» y lo que viene de otros orígenes o de extensiones (chrome-extension://, moz-extension://, safari-web-extension://). En el servidor, un límite propio REPORT_LIMITER de 20 informes por minuto por IP (IPv6 por /64), con contador aparte del contacto y otro para las Previews.\""
      },
      {
        "category": "persistence",
        "cite": {
          "kind": "path",
          "path": "docs/architecture/technical-baseline.md",
          "line": 36
        }
      },
      {
        "category": "copy",
        "question": "\"¿Lo cuenta la política de privacidad (es y en)? Propuesta: sí, una frase en «Qué datos»: si algo falla en la página, tu navegador envía a esta web un informe técnico del fallo, sin datos tuyos, que queda 3 días en los registros de Cloudflare.\""
      },
      {
        "category": "url-state",
        "question": "\"¿Qué URL se registra? Propuesta: de la página, solo la ruta, sin query ni fragmento; de la CSP, la URL bloqueada reducida a su origen (o a inline/eval).\""
      },
      {
        "category": "accessibility",
        "cite": {
          "kind": "path",
          "path": "docs/roadmap.md",
          "line": 97
        }
      },
      {
        "category": "errors",
        "question": "\"¿Qué responde y con qué severidad registra? Propuesta: 204 tanto si el informe se acepta como si se descarta por inválido o ajeno (sin pistas para quien abuse); 413 por encima de 8 KB, 429 por encima del límite y 503 sin el binding (fail-closed, como el contacto). Los informes propios exigen Origin del sitio; los de la CSP, que la página informada sea del sitio. En Workers Logs salen con severidad warn, para que error siga marcando solo los fallos del contacto que piden actuar.\""
      }
    ]
  },
