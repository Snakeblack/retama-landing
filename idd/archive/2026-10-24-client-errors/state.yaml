          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "src/lib/report.ts:49 FRAME_URL uses an unbounded lazy repetition `[^\\s()]+?` with an optional group and a lookahead, although the comment at lines 44-45 says every repetition is bounded. Trigger (from static analysis, not executed): POST application/json with a forged `Origin` header (curl, no authentication) and a `stack` of about 8 KB such as `at ` + `a://` x ~2000 + `(`. firstFrame (line 90) tries a start at each `a://`, and each start scans to the `(` before failing. That is roughly n^2/8, about 8M steps, on attacker-controlled input. The adversarial set in tests/unit/report.test.ts:83-92 has no repeated `scheme://` case, so the 50 ms guard at line 100 does not cover it. Impact: one request can burn far more CPU than the others, and on the free plan's 10 ms limit it would fail with CPU exceeded. The endpoint's own rate limit (20 requests a minute per IP) is the only cap.",
                "acceptance_criteria": "errorReport called with an 8 KB stack of the form `at ` + `a://` repeated + `(` (and a variant ending in `)`) returns in about the same time as the other adversarial inputs of tests/unit/report.test.ts:83-92, covered by a new case in that test. Existing outputs for valid V8 and Firefox/Safari frames (report.test.ts:21-57) stay unchanged."
              },
              {
                "severity": "SUGGESTION",
                "summary": "POST /api/report/ is unauthenticated: the Origin check is forgeable, and the application/reports+json and application/csp-report types do not require it. The only control on log volume is REPORT_LIMITER, 20 requests a minute per IP, counted per request and not per line. Each accepted request writes up to PAGE_REPORT_LIMIT=5 warn lines (src/server/report.ts:97), plus its invocation log. Every discarded, too-large or rate-limited request also writes a log line (lines 33-36). Worked figure: one IP at the limit can produce about 20 x 6 x 1440 = 172,800 events a day. That is about 86% of the 200,000 events a day that wrangler.jsonc:14-15 and technical-baseline.md:38 name as the free-plan quota, which is shared with the contact function's logs (the baseline line says its error-severity lines are the owner's diagnostics). Two IPs are enough to exceed the quota, and the 3-day retention would then hold little else. The ADR's review trigger (line 35) only notices this afterwards.",
                "acceptance_criteria": "The ADR or the code states and bounds the maximum Workers Logs events a single IP can produce through /api/report/ per day (including the invocation and outcome lines), either well below the 200,000-event quota or with an explicit external control (WAF rule) named as the mitigation. If the code changes, a unit test in tests/unit/report.test.ts asserts the new per-request bound."
              }
            ]
          },
          "operation": null,
