      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "El script de informes es pequeño y no pinta texto; entra en el presupuesto de 60 KB del JavaScript de inicio que comprueba js-budget"
    },
    {
      "kind": "adr",
      "id": "0002",
      "impact": "amends",
      "reason": "Añade una segunda ruta bajo demanda, /api/report/, sin estado, para los informes de errores de cliente y de la CSP; un ADR nuevo (0011) la justifica y amplía la lista permitida del fitness on-demand-routes",
      "record": "docs/architecture/decisions/0011-client-error-reports.md"
    },
    {
      "kind": "adr",
      "id": "0003",
      "impact": "conforms",
      "reason": "No guarda nada: registra una línea sin datos personales en Workers Logs y el límite de peticiones es un contador por ubicación, no un almacén"
    },
    {
      "kind": "adr",
      "id": "0006",
      "impact": "conforms",
      "reason": "Solo añade report-to y report-uri a la cabecera de la CSP y Reporting-Endpoints a _headers; ni unsafe-inline ni terceros nuevos"
    },
    {
      "kind": "adr",
      "id": "0007",
      "impact": "conforms",
      "reason": "Los informes van al propio origen, sin cookies, almacenamiento ni identificadores"
    },
