  "intent": {
    "request": "si hazlo en un change pequeño",
    "kind": "bug",
    "summary": "robots.txt and llms.txt are served as text/plain without a charset, so a browser may show the UTF-8 of llms.txt (Información) as mojibake",
    "acceptance": "/robots.txt and /llms.txt are served with Content-Type text/plain; charset=utf-8 and keep every security header of the site"
  },
