      "answer": "todos los recomendados: (1) Markdown .md sin MDX; M5 en dos changes: blog (colecciones, índice, artículo, canónica, hreflang, JSON-LD BlogPosting y BreadcrumbList, sitemap, llms.txt, OG con la imagen del idioma) y blog-feed (RSS por idioma en /blog/rss.xml y /en/blog/rss.xml e imagen OG por artículo); (2) slug traducido por idioma con clave común en el frontmatter; (3) para clientes, el agente redacta 2 artículos iniciales en es y en para revisión (cuánto cuesta y cuánto tarda un software a medida; por qué dejamos por escrito cada decisión), firma la marca Retama; (4) /blog/ y /en/blog/<slug>/, Blog en la cabecera de todas las páginas, en el índice de capítulos del móvil y en el pie; (5) artículo con h1, entradilla, fecha de publicación y actualización, tiempo de lectura, cuerpo a measure con h2/h3, listas, enlaces y citas, imágenes opcionales en gris, sin bloques de código; índice en tiles del más reciente al más antiguo sin etiquetas ni paginación; (6) el build falla si un artículo no está en los dos idiomas (ADR 0008)",
