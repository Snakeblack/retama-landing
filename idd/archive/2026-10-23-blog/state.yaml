    {
      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "The index and the articles are static HTML generated at build time from Markdown; no script is added and the E2E reads them with JS disabled"
    },
    {
      "kind": "adr",
      "id": "0005",
      "impact": "conforms",
      "reason": "DESIGN.md describes the blog, header, index and footer changes; the pages and the article body styles use only the generated tokens and design:lint passes"
    },
    {
      "kind": "adr",
      "id": "0006",
      "impact": "conforms",
      "reason": "No inline style or handler: the build refuses code in articles, which the highlighter would render with inline style attributes the CSP blocks"
    },
    {
      "kind": "adr",
      "id": "0008",
      "impact": "conforms",
      "reason": "Each article has its own translated slug; alternates and the language switch take the paths of every language, x-default included, and the build fails when an article misses a language; the reciprocal hreflang E2E covers the new sitemap URLs"
    },
    {
      "kind": "adr",
      "id": "0002",
      "impact": "conforms",
      "reason": "The blog pages are static assets of the same Worker; no new service, binding or route handler"
    },
    {
      "kind": "adr",
      "id": "0003",
      "impact": "none",
      "reason": "Articles live in the repository and are read at build time; nothing is stored at runtime"
    },
    {
      "kind": "scenario",
      "id": "brand-impact",
      "impact": "conforms",
      "reason": "The blog follows the board: raised tiles, statement and headline sizes, the field for quotes and the one primary action"
    },
    {
      "kind": "scenario",
      "id": "perf-mobile",
      "impact": "conforms",
      "reason": "No JavaScript and no new requests: the pages reuse the inlined stylesheet and the self-hosted fonts"
    },
    {
      "kind": "scenario",
