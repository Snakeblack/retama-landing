{
  "schema": "idd-state/v1",
  "change": "dependency-alerts",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Las alertas de Dependabot de repo-secret-protection no ven ninguna dependencia npm, porque pnpm 12 escribe el lockfile en dos documentos YAML y GitHub solo lee el primero (dependabot-core#15904), así que un aviso nuevo entre pushes no avisa a nadie. Un pnpm audit programado en CI cubre ese hueco con el mismo umbral e ignorados que la puerta de los PR, y la línea 1 de M7 se corrige",
    "acceptance": "Un workflow programado a diario y lanzable a mano ejecuta pnpm audit --audit-level high sin instalar dependencias y falla ante un aviso alto nuevo; un test fija que el lockfile tenga un solo documento y que use el mismo comando de audit que el CI; docs/roadmap.md M7 describe la cobertura real; tras fusionar, el SBOM del dependency graph lista las dependencias npm del proyecto"
  },
  "facts": {
    "open": [
      "Además del audit programado, ¿restauro Dependabot para npm con pmOnFail: ignore y el lockfile en un solo documento? Coste: pnpm deja de imponer la versión 12.14.0 en local; el CI y Workers Builds siguen fijados por packageManager",
      "Cuando el audit programado falle, ¿basta el email de GitHub del workflow fallido, o además abre o actualiza una issue?",
      "Cuando Dependabot vea las dependencias, ¿descarto las 3 alertas altas que pnpm-workspace.yaml ya acepta (extract-zip y zod) con el mismo motivo, dejando abiertas las 2 moderadas de desarrollo?"
    ]
  },
  "plan": {
