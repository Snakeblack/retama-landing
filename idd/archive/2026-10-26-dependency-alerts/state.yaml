                "severity": "WARNING",
                "summary": "pnpm-workspace.yaml:5-8 sets pmOnFail: ignore, and pnpm-lock.yaml loses its env document (former lines 1-158, the integrity hashes for pnpm 12.14.0 and @pnpm/exe.*). pnpm stops switching itself to packageManager, and the lockfile no longer records a hash for the pnpm tool. The committed claim 'the CI and Workers Builds still take the exact pnpm version from packageManager' holds for CI, where pnpm/action-setup without `version` reads packageManager (ci.yml:23). Nothing in the repo shows how Workers Builds gets pnpm 12.14.0 for the production build: there is no PNPM_VERSION or Corepack config, and the S1 change drops Corepack. If it has no such mechanism, production builds run whichever pnpm the image ships, and that tool is not hash-checked.",
