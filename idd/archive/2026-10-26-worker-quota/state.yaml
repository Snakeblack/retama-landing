    "basis": "The user answered the four open facts on 2026-10-26: accept the risk in ADR 0012 amending 0011; review trigger whichever comes first of retama-app opening to clients or above 25 % of the limit for several days; a 429 without the function's body is unavailable; no WAF rule for scanner paths"
  },
