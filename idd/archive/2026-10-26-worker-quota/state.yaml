    "summary": "The Workers Free daily request limit (100,000/day per account, shared with retama-app) is undecided, and the contact form shows any 429, Cloudflare's included, as 'wait a minute' (M7 5/6)",
    "acceptance": "A 429 without the function's rate-limited body shows the unavailable failure with mail and WhatsApp; ADR 0012, amending 0011, records the accepted daily limit, its impact (landing and retama-app), detection and review trigger; docs/roadmap.md marks worker-quota done"
