      "answer": "El usuario eligió «ADR que acepta (Recomendado)», cuya opción decía: «ADR 0012 que amplía el 0011: deja escritos el riesgo, el impacto (la landing pierde el formulario, retama-app cae entera), cómo se detecta (el uptime de /api/contact/) y cuándo se revisa. Coste cero.»",
