  "intent": {
    "request": "Dominio primero: retama.dev en el Worker. Cuando retama.dev esté activo, apagar retama-landing.retamozogpt.workers.dev",
    "kind": "feature",
    "summary": "Serve the site on its definitive domain retama.dev: a Custom Domain on the Worker, retama.dev as the production origin for canonicals, hreflang, sitemap, robots.txt and llms.txt, and the workers.dev URL turned off while branch Previews keep working",
    "acceptance": "https://retama.dev/ and https://retama.dev/en/ serve the site with every security header; canonicals, hreflang, sitemap, robots.txt and llms.txt name https://retama.dev; the production workers.dev URL no longer serves the site; branch Preview URLs still deploy"
  },
