  "impacts": [
    {
      "kind": "adr",
      "id": "0002",
      "impact": "conforms",
      "reason": "Still one deployable with /api/contact as its only on-demand route; the Custom Domain only adds a hostname to the same Worker"
    },
    {
      "kind": "adr",
      "id": "0006",
      "impact": "conforms",
      "reason": "Every header and the CSP stay in the single /* block of public/_headers; HSTS keeps includeSubDomains and needs no preload because .dev is a preloaded TLD; the CSP names no host of its own"
    },
    {
      "kind": "adr",
      "id": "0008",
      "impact": "conforms",
      "reason": "Locale routing is unchanged; canonicals and hreflang move to the https://retama.dev origin and stay reciprocal (E2E ADR 0008)"
    },
    {
      "kind": "scenario",
      "id": "privacy-security",
      "impact": "conforms",
      "reason": "No header is weakened; the contact Origin check compares with the request's own origin (src/server/contact.ts:163), so it holds on the new host"
    },
    {
      "kind": "scenario",
      "id": "seo-discovery",
      "impact": "conforms",
      "reason": "One public origin: canonicals, hreflang, sitemap, robots.txt and llms.txt name https://retama.dev and the duplicate workers.dev host is turned off"
    }
  ],
