  "impacts": [
    {
      "kind": "adr",
      "id": "0002",
      "impact": "conforms",
      "reason": "El entrypoint del Worker no añade ninguna ruta: solo entrega a Astro /api/contact y manda lo demás a los assets, así que las rutas que Astro inyecta en el build quedan fuera de alcance y las rutas bajo demanda alcanzables vuelven a ser exactamente las de la lista. La fitness on-demand-routes hace la revisión del build que pide el ADR sobre las rutas del build, no sobre src/pages."
    },
    {
      "kind": "adr",
      "id": "0006",
      "impact": "conforms",
      "reason": "La CSP de páginas con hashes sigue como cabecera estática de _headers y el Worker nunca la sustituye. Lo que responde el Worker, que no son páginas, recibe HSTS, nosniff, Referrer-Policy, Permissions-Policy, X-Frame-Options, COOP y una CSP que no carga nada, con frame-ancestors 'none'; sin unsafe-inline ni unsafe-eval."
    },
    {
      "kind": "adr",
      "id": "0011",
      "impact": "conforms",
      "reason": "/api/report/ sigue siendo la segunda y última ruta bajo demanda, sin cambios en su comportamiento; ahora sus respuestas llevan también las cabeceras de seguridad. La fitness on-demand-routes mantiene su lista permitida (/api/contact y /api/report) y además exige que la lista del Worker sea la misma."
    }
  ],
