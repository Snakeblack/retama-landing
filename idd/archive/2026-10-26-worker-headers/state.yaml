{
  "schema": "idd-state/v1",
  "change": "worker-headers",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Las respuestas que genera el Worker (API, redirecciones y las rutas /_image/ y /_server-islands/ que inyectan Astro y el adaptador) salen sin las cabeceras de seguridad de public/_headers, y la fitness on-demand-routes no ve esas rutas porque solo mira src/pages (M7 3/6, auditoría OWASP A02)",
    "acceptance": "En el build servido por workerd, toda respuesta del Worker lleva HSTS, nosniff, X-Frame-Options, Referrer-Policy, Permissions-Policy, COOP y una CSP (la de los assets si ya la trae, y si no una que lo bloquea todo); /_image/ y /_server-islands/ responden como una ruta que no existe; y node scripts/fitness.mjs on-demand-routes falla si el build tiene una ruta bajo demanda fuera de /api/contact y /api/report que el Worker no retire"
  },
  "facts": {
    "basis": "El punto 3 de M7 en docs/roadmap.md fija el alcance (cabeceras en toda respuesta del Worker, retirar las rutas del adaptador que el sitio no usa y la fitness sobre las rutas del build). El código fija el resto: una ruta que no existe responde con la página 404 del sitio desde los assets, con sus cabeceras (comprobado con wrangler dev sobre el build); las cabeceras son las del bloque /* de public/_headers; el build no referencia /_image ni /_server-islands (imageService compile, ningún server:defer); y la documentación de Astro da el entrypoint propio del Worker (main en wrangler y handle de @astrojs/cloudflare/handler)"
  },
  "plan": {
    "paths": [
      ".github/workflows/ci.yml",
      "docs/architecture/technical-baseline.md",
      "docs/roadmap.md",
      "scripts/fitness.mjs",
