  "intent": {
    "kind": "feature",
    "summary": "Escena fijada de Sectores (M2): desde lg la sección se fija y cada paso cambia el fragmento data-ui del grupo por uno propio del sector (Logística: rutas; Empresa: cola de aprobaciones; Gaming: herramienta de estudio; Otros: interfaz en marca blanca que cambia de marca) con un wipe y el nombre del sector en grande; todos rotulados «Ejemplo» y presentes en el HTML sin JS",
    "acceptance": "En / y /en/ desde 1024px con movimiento la sección Sectores se fija unas 2,5 pantallas y recorre los 4 sectores, cada uno con su fragmento y un wipe entre ellos; por debajo de lg, con reduced-motion y sin JS no se fija y los cuatro sectores con sus fragmentos se ven; los textos están en es y en; CSP sin violaciones, presupuesto de JS y Lighthouse 100 x4"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿cómo se ven los cuatro fragmentos sin la escena (móvil, reduced-motion, sin JS): cada sector con su fragmento debajo, o solo la lista y un fragmento?"
      },
      {
        "category": "uniqueness",
        "question": "¿el cambio entre sectores va ligado al scroll (scrub) o es un wipe por tiempo al cruzar cada cuarto de la escena, sin snap?"
      },
      {
        "category": "persistence",
        "question": "¿la frase «¿Tu sector no está?» y la de remoto quedan fuera de la escena, debajo, o dentro del tramo fijado?"
      },
      {
        "category": "copy",
        "question": "¿qué muestra cada fragmento nuevo (Empresa, Gaming, Otros) y qué marcas ficticias recorre el de marca blanca, en es y en?"
      },
      {
        "category": "url-state",
        "question": "¿al entrar por el ancla #sectores (nav) la escena empieza en Logística, al inicio del tramo fijado?"
      },
      {
        "category": "accessibility",
        "question": "¿la escena muestra además una lista de los cuatro nombres con el activo en tinta como progreso, o solo el sector activo en grande?"
      },
      {
        "category": "errors",
        "question": "si GSAP o ScrollTrigger no cargan, ¿basta con que quede la versión apilada sin fijar?"
      }
    ]
