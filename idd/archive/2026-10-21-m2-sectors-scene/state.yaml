    },
    {
      "kind": "adr",
      "id": "0006",
      "impact": "conforms",
      "reason": "Sin style ni manejadores inline: el pin, el wipe y el z-index van por CSSOM desde la isla de la portada; el e2e de CSP con workerd no ve violaciones"
    },
    {
      "kind": "adr",
      "id": "0008",
