      "impact": "conforms",
      "reason": "Los cuatro sectores con sus fragmentos y las tres marcas están en el HTML; sin JS, en el móvil y con reduced-motion se apilan. El script solo recoloca y anima, y el presupuesto de JS por página sigue comprobándose"
