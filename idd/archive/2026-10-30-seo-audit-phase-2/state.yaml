  "intent": {
    "request": "Preseleccionar servicio; OnlineBusiness; Enlazar «Manuel M.»; Tabla de precios, Cloudflare a mano, 301 en lugar de 307",
    "kind": "feature",
    "summary": "Fase 2 de la auditoría SEO de retama.dev: el CTA de cada servicio abre el formulario con su tipo marcado y ofrece la reserva, Retama pasa a OnlineBusiness en el JSON-LD, la firma del blog enlaza al equipo, el artículo de costes trae una tabla de precios atada a services.ts, las URL sin barra final responden 301 y la zona activa Crawler Hints",
    "acceptance": "Desde una página de servicio, Hablemos lleva al formulario de la home con el tipo de ese servicio marcado y la página ofrece Reservar una llamada; el JSON-LD tipa a Retama como OnlineBusiness; la firma de cada artículo enlaza al capítulo del equipo y su autor lleva sameAs; el artículo de costes, en es y en, trae una tabla de precios que un test compara con services.ts; /blog y cada página pedida sin barra final responden 301 a su URL con barra; technical-baseline recoge la configuración de la zona"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "Los dos enlaces de la página de servicio. Hablemos a /?projectType=<web|software|agents|seo>#contacto en los dos idiomas, con el nombre y los valores del propio campo como los dejaría un formulario GET (recomendado), o un parámetro traducido (?tipo= / ?type=). Y Reservar una llamada a la página de Cal.com (cal.com/retama/llamada), sin script ni marco y solo con PUBLIC_BOOKING=true, como la home sin JS (recomendado), o a /#contacto con un parámetro que abra allí el calendario"
      },
      {
        "category": "uniqueness",
        "question": "El nodo de Retama con un solo tipo, OnlineBusiness, que ya es subtipo de Organization como en los ejemplos de Google (recomendado), o con los dos, Organization y OnlineBusiness"
      },
      {
        "category": "persistence",
        "question": "Si el navegador ya trae un tipo marcado al volver atrás o recargar, se respeta lo que marcó la persona (recomendado) o manda el parámetro"
      },
      {
        "category": "copy",
        "question": "Filas de la tabla del artículo de costes, las de software a medida (diagnóstico desde 900 €, aplicación web desde 8.000 € en 4 a 8 semanas, escritorio desde 10.000 € en 6 a 10 semanas y mantenimiento desde 120 €/mes), cada una enlazada a su página (recomendado), o los precios de partida de todos los servicios"
      },
      {
        "category": "url-state",
        "question": "Las redirecciones. El 301 de las URL sin barra final con un _redirects generado en el build, una línea por página (/blog /blog/ 301), versionado y probado con E2E sobre workerd, y las rutas que no existen siguen dando 404 directo (recomendado), o una regla a mano en la zona para toda ruta sin punto fuera de /api/, que añade un salto antes de cada 404. Y http://www en un salto, que exige apagar Always Use HTTPS en toda la zona (compartida con clientes.retama.dev) y sustituirlo por dos reglas a mano; dejarlo en dos saltos (recomendado, HSTS ya lleva a HTTPS al navegador que entró una vez y Google sigue hasta 10 saltos) o hacer el cambio"
      },
      {
        "category": "accessibility",
        "question": "La firma Manuel M. como enlace en línea subrayado, como los del cuerpo del artículo, dentro de su fila (recomendado; supera los 24 px de WCAG 2.5.8), o la fila entera como enlace de 48 px con su anillo de foco"
      },
      {
        "category": "errors",
        "question": "Un valor que no es uno de los cinco tipos (?projectType=xyz, o Software con mayúscula) se ignora sin aviso y el formulario queda sin marcar, sin normalizar mayúsculas (recomendado), o se normaliza"
      }
    ]
  },
