  "impacts": [
    {
      "kind": "adr",
      "id": "0002",
      "impact": "conforms",
      "reason": "La única ruta bajo demanda es src/pages/api/contact.ts, la de la allowlist; no hay output server"
    },
    {
      "kind": "adr",
      "id": "0003",
      "impact": "conforms",
      "reason": "Sin almacén: el lead va a Resend con dos destinatarios y se descarta; ratelimits es un contador por ubicación, no un binding persistente; llega el test de logs sin campos personales que pedía el ADR"
    },
    {
      "kind": "adr",
      "id": "0006",
      "impact": "conforms",
      "reason": "Sin cambios en la CSP: la función responde JSON con nosniff y no-store; las llamadas a siteverify y Resend salen del servidor, no del navegador"
    },
    {
      "kind": "adr",
      "id": "0009",
      "impact": "conforms",
      "reason": "Las puertas de entrega siguen igual; el E2E y Lighthouse sirven ahora dist/server/wrangler.json, que el adaptador genera al haber una ruta bajo demanda"
    },
    {
      "kind": "scenario",
      "id": "perf-mobile",
      "impact": "none",
      "reason": "Los activos estáticos se sirven antes que el Worker (sin run_worker_first); la página no carga nada nuevo"
    },
    {
      "kind": "scenario",
      "id": "privacy-security",
      "impact": "conforms",
      "reason": "Validación, honeypot, Turnstile fail-closed, límite por IP y comprobación de Origin en servidor; logs sin datos personales"
    }
  ],
