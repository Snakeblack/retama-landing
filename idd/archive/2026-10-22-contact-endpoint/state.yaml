{
  "schema": "idd-state/v1",
  "change": "contact-endpoint",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "feature",
    "summary": "Función /api/contact: valida el formulario, descarta el honeypot, verifica Turnstile (fail-closed), limita por IP y entrega el lead por Resend a la bandeja principal y a la de respaldo, sin guardar ni registrar datos personales",
    "acceptance": "POST /api/contact responde éxito solo tras entregar a ambas bandejas; rechaza entrada inválida, token inválido o ausente, exceso de envíos y fallo del proveedor con un código de error distinto; ningún log contiene campos personales; tests con Resend y siteverify simulados"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿qué campos, cuáles obligatorios, con qué límites de longitud, si el tipo de proyecto es lista cerrada y si acepta solo JSON o también un envío de formulario sin JS?"
      },
      {
        "category": "uniqueness",
        "question": "¿se limita por IP, con qué cupo y ventana, qué pasa si el binding no está disponible, y se normaliza el email (trim, minúsculas)?"
      },
      {
        "category": "persistence",
        "question": "¿una sola llamada a Resend con los dos destinatarios (llega a ambas o a ninguna) o dos llamadas independientes?"
      },
      {
        "category": "copy",
        "question": "¿asunto, idioma y Reply-To del email que recibes?"
      },
      {
        "category": "url-state",
        "question": "¿la ruta es /api/contact sin variante por idioma, con el idioma del visitante en el cuerpo?"
      },
      {
        "category": "accessibility",
        "question": "¿se rechazan peticiones con Origin de otro sitio y se comprueban el hostname y la acción del token de Turnstile?"
      },
      {
        "category": "errors",
        "question": "¿qué responde a un honeypot relleno, qué código HTTP y cuerpo da cada fallo (entrada, verificación, límite, proveedor, configuración ausente) y cuántos segundos espera a Resend y a siteverify?"
      }
    ]
  },
  "plan": {
    "paths": [
      ".gitignore",
