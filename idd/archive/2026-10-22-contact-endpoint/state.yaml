                "severity": "WARNING",
                "summary": "src/server/contact.ts:75-77 readBody calls request.text() on the whole body and only then compares the byte length to MAX_BODY_BYTES (16 KB). A non-browser client can set a matching Origin header and POST a body far larger than 16 KB. The Worker buffers and decodes all of it before returning 400. Impact: the 16 KB cap does not bound memory or CPU per request.",
                "acceptance_criteria": "A request whose Content-Length is above 16 KB, or whose streamed body goes past 16 KB, is rejected with 400 {fields: []} without the whole body being buffered. A unit test covers an oversized declared length and an oversized body with no Content-Length. A body at or below 16 KB still parses as before."
              },
              {
                "severity": "SUGGESTION",
                "summary": "src/server/contact.ts:127-128 uses the raw CF-Connecting-IP string as the rate-limit key. An IPv6 client usually controls a whole /64, so it can rotate source addresses and take a fresh 3-per-minute allowance each time. The Turnstile check remains the main control.",
                "acceptance_criteria": "For an IPv6 CF-Connecting-IP, two addresses in the same /64 map to the same limiter key, and IPv4 addresses keep their current per-address key. A unit test asserts both. Alternatively, a documented decision explains why per-/128 keys are accepted."
              }
            ]
