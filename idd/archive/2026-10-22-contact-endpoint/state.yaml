  "gates": [
    {
      "id": "open-facts",
      "status": "resolved",
      "answer": "Todas las propuestas aceptadas: campos name≤100, email≤254, projectType obligatorio en lista cerrada web|software|agents|seo|other, message 10–4000, locale es|en, honeypot website, turnstileToken; solo JSON. Honeypot → 200 falso sin envío; 400 invalid con fields, 403 verification, 429 rate-limited, 502 delivery, 503 unavailable; timeouts 5 s siteverify, 8 s Resend. Rate limit por IP 3/60 s con binding ratelimits, fail-closed 503, IP nunca en logs; email solo trim. Una sola llamada a Resend con to [principal, respaldo]. Email en español, asunto 'Nuevo contacto: {tipo} — {nombre}', Reply-To del visitante, texto plano, idioma del visitante en el cuerpo. 403 si Origin ajeno; comprobar hostname y action contact. Ruta única /api/contact con locale en el cuerpo.",
      "source": "user"
    }
  ],
