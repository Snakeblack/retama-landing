  "intent": {
    "kind": "bug",
    "summary": "Harden the contact surface (#59): fetch to Resend and Turnstile siteverify never follow redirects, the Cal.com iframe is sandboxed, and a Workers Builds build refuses Turnstile's test site key",
    "acceptance": "Contact unit tests prove a 3xx from Resend or siteverify is not followed and fails closed; the booking iframe carries a sandbox attribute and the booking flow still works in a browser; a build with WORKERS_CI=1 and no site key or a test site key fails, while local, CI and E2E builds do not"
  },
  "facts": {
    "open": [
      "Sandbox tokens for the Cal.com iframe: allow-scripts allow-same-origin allow-forms allow-popups, plus allow-popups-to-escape-sandbox so links Cal.com opens in a new tab work normally?",
      "Manual booking test: I drive a real booking on a local build with real Cal.com and cancel it afterwards through the Cal.com MCP, or the user books by hand on a Preview?",
      "Which Turnstile site keys does a WORKERS_CI=1 build refuse: only a missing key or the default 1x00000000000000000000AA, or every Turnstile test key (1x/2x/3x00000000000000000000xx)? And Preview builds too, as with the legal owner?",
      "The optional hardening of /api/contact/ response headers (HSTS, X-Frame-Options): include it or leave it out?"
    ]
  },
