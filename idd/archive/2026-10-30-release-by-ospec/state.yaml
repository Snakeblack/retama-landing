          "summary": "scripts/lib/branch-protection.mjs:8-16 declares main safe whenever required_pull_request_reviews exists and enforce_admins.enabled is true, and scripts/fitness.mjs:96 then prints 'requires a pull request, also from admins'. The check does not read required_pull_request_reviews.bypass_pull_request_allowances or allow_force_pushes.enabled. If either is turned on (for example the owner is added as a bypass actor, or force pushes are allowed), the owner can push the release commit straight to main, which deploys to production without the gates, and the check still passes. The unit-test fixture (tests/unit/branch-protection.test.ts:6-13) has neither field. I did not run it against GitHub, and I assume the bypass list overrides enforce_admins. The risk is conditional on a later configuration drift.",
