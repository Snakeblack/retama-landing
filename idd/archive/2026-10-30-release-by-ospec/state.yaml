          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "scripts/lib/branch-protection.mjs:8-16 declares main safe whenever required_pull_request_reviews exists and enforce_admins.enabled is true, and scripts/fitness.mjs:96 then prints 'requires a pull request, also from admins'. The check does not read required_pull_request_reviews.bypass_pull_request_allowances or allow_force_pushes.enabled. If either is turned on (for example the owner is added as a bypass actor, or force pushes are allowed), the owner can push the release commit straight to main, which deploys to production without the gates, and the check still passes. The unit-test fixture (tests/unit/branch-protection.test.ts:6-13) has neither field. I did not run it against GitHub, and I assume the bypass list overrides enforce_admins. The risk is conditional on a later configuration drift.",
                "acceptance_criteria": "protectionProblems returns a problem for a main whose required_pull_request_reviews.bypass_pull_request_allowances names any user, team or app, and for allow_force_pushes.enabled true. Unit tests cover each case and the fully protected fixture still returns []. The message printed by fitness.mjs no longer claims 'also from admins' when either gap exists. No documentation may state an enforcement the check does not verify."
              },
              {
                "severity": "SUGGESTION",
                "summary": "AGENTS.md:42-47 (Entrega, steps 2-3) leaves the post-merge check open. Step 3, 'El CI de ese commit en main está en verde', names no command and no rule for pending, cancelled or absent runs. ci.yml:5-15 runs on push to main with cancel-in-progress on group ci-refs/heads/main, so a cancelled or still-running run is plausible. The wrong-SHA risk is already covered: step 4 tags an explicit SHA, and step 2 stops if the HEAD is not the release commit. But the tag and Release can go out on a main commit whose gates never finished, because the 'green' reading is left to the operator. Step 2 also does not check that CHANGELOG.md has the '## [x.y.z]' heading from which step 5 takes the notes.",
                "acceptance_criteria": "The Entrega section states how to read the quality, e2e and lighthouse results for the exact SHA to tag (for example gh api on the commit's check-runs). It requires conclusion success on all three and tells the operator to stop and not tag if any is pending, cancelled, failed or absent. Step 2 also requires the '## [x.y.z]' section in CHANGELOG.md at that SHA before the notes file is made."
              }
            ]
          },
