{
  "schema": "idd-state/v1",
  "change": "og-images",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "feature",
    "summary": "Generate one Open Graph image per language at build time and declare it, with the Open Graph and Twitter card tags, on every indexable page",
    "acceptance": "After pnpm build, dist/client/og/es.png and dist/client/og/en.png are 1200x630 PNGs drawn in the DESIGN.md tokens with the copy of their language; every indexable page carries og:title, og:description, og:url, og:locale, og:image (absolute URL to its language's image) with width, height and alt, and twitter:card summary_large_image; the 404 pages carry none"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "which territory goes with og:locale for English (en_US or en_GB); Spanish is es_ES?"
      },
      {
        "category": "uniqueness",
        "question": "one image per language shared by the home and the legal page, or one per page?"
      },
      {
        "category": "persistence",
        "question": "images are build output only (dist/client/og), never committed; dev serves none?"
      },
      {
        "category": "copy",
        "question": "what does the image show (wordmark, the two-tone title, the lead, the retama poster)?"
      },
      {
        "category": "url-state",
        "question": "fixed URLs /og/es.png and /og/en.png with no hash, so a changed image keeps its URL?"
      },
      {
        "category": "accessibility",
        "question": "og:image:alt comes from a new i18n key in es.ts and en.ts?"
      },
      {
        "category": "errors",
        "question": "may the build add satori, sharp and a static Stack Sans font as dev dependencies, and fail the build when the image cannot be drawn?"
      }
    ]
  },
  "plan": {
