# IDD configuration of this project. Approved by the user on 2026-10-21 (foundation).
# The checks run once the S1 walking skeleton creates the scaffold (docs/roadmap.md).

# Team profile: one senior maintainer working with agents (docs/product/brief.md).
team:
  size: solo
  experience: senior

# Delivery by the playbook's retama:delivery (ADR 0014, 2026-10-30): one change in flight, a version per merged change.
delivery:
  branching: serial
  changelog: CHANGELOG.md
  release: per-change

# The checks `ospec check` runs, in order.
checks:
  lint: pnpm lint
  typecheck: pnpm typecheck
  test: pnpm test
  e2e: pnpm test:e2e
  design: pnpm design:lint

# Contract documents: the design system, the i18n keys, the contact endpoint and the technical baseline, which records
# the platform, the domain and the integrations that astro.config and wrangler.jsonc set (approved 2026-10-23, domain).
contracts:
  documents:
    - DESIGN.md
    - docs/architecture/technical-baseline.md
    - src/i18n/**
    - src/pages/api/**

# Impact patterns for IDD signals. No persistent data by ADR 0003.
impact:
  public_contract:
    - src/pages/api/**
    - src/i18n/**
    - astro.config.*
    - public/robots.txt
    - DESIGN.md
  security_boundary:
    - src/pages/api/**
    - src/server/**
    - public/_headers
    - wrangler.jsonc
    - .github/workflows/**
    - .claude/**
    - .mcp.json
  persistent_data: []
