# Quality gates required on main (ADR 0009). Workers Builds deploys previews and
# production; this workflow decides whether a change may merge.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm design:lint
      - run: pnpm skills:scan
      - run: pnpm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The call booking, WhatsApp, the legal owner and Web Analytics are off by default; E2E builds with them on to prove
      # them (a local run proves them off). The number, the owner and the analytics token are test ones: the real ones
      # live only in Workers Builds.
      - run: pnpm test:e2e
        env:
          PUBLIC_BOOKING: "true"
          PUBLIC_CF_ANALYTICS_TOKEN: "0123456789abcdef0123456789abcdef"
          PUBLIC_WHATSAPP_NUMBER: "34600000000"
          PUBLIC_LEGAL_NAME: "Titular de Prueba"
          PUBLIC_LEGAL_TOWN: "Localidad de Prueba (Madrid)"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The fitness checks that read the build: the on-demand routes of the Worker, its bindings and the start-up JavaScript.
      - run: node scripts/fitness.mjs on-demand-routes
      - run: node scripts/fitness.mjs no-persistent-bindings
      - run: node scripts/fitness.mjs js-budget
      # perf-mobile: 100 in the four categories on the mobile preset (lighthouserc.json).
      - run: pnpm exec lhci autorun
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
