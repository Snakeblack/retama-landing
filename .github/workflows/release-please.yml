# SemVer release PRs from Conventional Commits (ADR 0009). The PR is opened with
# a fine-grained PAT so that its CI runs: PRs opened with GITHUB_TOKEN trigger no
# workflows and could never pass the required checks.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
