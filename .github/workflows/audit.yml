# Dependency advisories published between two pushes (M7). The pull request gate (ci.yml, ADR 0009) only audits when
# something changes; this runs the same command on main every day. pnpm audit reads the lockfile alone, so nothing is
# installed. GitHub emails a failed run to whoever last changed the cron, and disables the schedule after 60 days
# without activity in a public repository; Dependabot alerts cover that gap.
name: audit

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm audit --audit-level high
