allowBuilds:
  esbuild: true
  workerd: true

# By default pnpm 12 puts its own version first in pnpm-lock.yaml, as a YAML document of its own, and GitHub's
# dependency graph reads only that one (dependabot-core#15904), so Dependabot saw no npm dependency. With ignore the
# lockfile is one document, but pnpm no longer switches itself to packageManager and the lockfile no longer records the
# hash of pnpm itself (accepted). packageManager stays the pin: the CI installs it with pnpm/action-setup, and a
# Workers Builds build stops with any other pnpm (scripts/lib/pnpm-pin.mjs).
pmOnFail: ignore

overrides:
  # 1.64 needs wrangler ^4.151, newer than pnpm's minimum release age.
  "@cloudflare/vite-plugin": 1.63.2
  # @lhci/cli (no release since 06-2025) pins vulnerable transitive versions.
  "tmp": ">=0.2.6"
  "basic-ftp": ">=6.2.1"
  "body-parser@1": "^1.20.9"
  # miniflare (wrangler, the Astro adapter) pins undici 7.28.0, even in its latest release.
  "undici@7": "^7.30.1"

auditConfig:
  ignoreGhsas:
    # extract-zip has no patched release. Only @puppeteer/browsers uses it, to unzip
    # downloaded browsers; Lighthouse CI runs the installed Chrome and downloads none.
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    # zod 3 has no patched release (the fix is 4.6.6). Only @google/design.md, on our own
    # DESIGN.md, and chromium-bidi, on messages from the local Chrome, validate with it.
    - GHSA-mrhx-c7xc-m3w5
